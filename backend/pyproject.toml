[project]
name = "viralclip-backend"
version = "0.1.0"
description = "Local AI video-clipping backend (FastAPI) that turns long videos into vertical viral clips"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-ai",
    "python-dotenv",
    "yt-dlp",
    "openai-whisper",
    "assemblyai",
    "opencv-python",
    "mediapipe",
    "numpy",
    "srt",
    "aiofiles",
    "sse-starlette",
    "requests",
    "pillow",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
